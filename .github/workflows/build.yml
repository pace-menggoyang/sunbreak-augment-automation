name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt

      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract -y
          # choco installs it, but doesn't refresh PATH for the rest of
          # this job -- later steps run in fresh shells that only see
          # GITHUB_PATH additions made explicitly, not whatever choco
          # broadcast to the (already-passed) system environment.
          echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH

      - name: Run offline test suite
        shell: bash
        run: |
          for f in tests/test_*.py; do
            python "$f" || exit 1
          done

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pyinstaller>=6.20

      - name: Vendor Tesseract (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install tesseract dylibbundler
          chmod +x packaging/vendor_tesseract_macos.sh
          ./packaging/vendor_tesseract_macos.sh

      - name: Vendor Tesseract (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install tesseract -y
          powershell -File packaging/vendor_tesseract_windows.ps1

      - name: Build with PyInstaller
        run: pyinstaller packaging/qurio-aug.spec --noconfirm

      - name: Selfcheck (macOS)
        if: matrix.platform == 'macos'
        run: ./dist/qurio-aug --selfcheck

      - name: Selfcheck (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\dist\qurio-aug.exe --selfcheck

      - uses: actions/upload-artifact@v4
        with:
          name: qurio-aug-${{ matrix.platform }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip platform builds
        run: |
          cd artifacts/qurio-aug-macos && zip -r ../../qurio-aug-macos.zip . && cd -
          cd artifacts/qurio-aug-windows && zip -r ../../qurio-aug-windows.zip . && cd -

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            qurio-aug-macos.zip qurio-aug-windows.zip \
            --generate-notes
